version: '3.8'

services:
  # FastAPI App Service
  app:
    build: .
    container_name: pinlens_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_SERVER=db
      - POSTGRES_USER=pinlens_user
      - POSTGRES_PASSWORD=pinlens_secret
      - POSTGRES_DB=pinlens_db
    volumes:
      - ./src:/app/src
    depends_on:
      - redis
      - db
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # Redis In-Memory Cache & Event Store
  redis:
    image: redis:7-alpine
    container_name: pinlens_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: pinlens_postgres
    environment:
      - POSTGRES_USER=pinlens_user
      - POSTGRES_PASSWORD=pinlens_secret
      - POSTGRES_DB=pinlens_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data: